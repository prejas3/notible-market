name: validate catalog
on:
  pull_request:
    paths: ["catalog.json", "scripts/build-catalog.mjs"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-catalog.mjs --check
